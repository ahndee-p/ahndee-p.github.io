# Hero Settings
hero:
  enable: true
  # hero__title is the homepage <h1>. Keeping the name in it is deliberate — with three
  # other Andrew Perezes out there, the one H1 on the most-linked page should say who this is.
  hero__title: Hi everyone, I’m Andrew Perez.
  # Andrew's positioning statement, revised 2026-09-11. "Agentic Technical SEO" deliberately
  # is NOT here — he's content to establish it as a DefinedTerm first rather than lead with a
  # phrase nobody searches yet. "agentic" now modifies the systems instead of the title.
  # The differentiator that used to sit here moves to the DefinedTerm description on the
  # "What Is Agentic Technical SEO?" page, which is what it was always best suited to.
  hero__description: I’m a Technical SEO leader building agentic AI systems that automate the infrastructure behind search and AI visibility.
  hero__image: "/images/ap-lecture.png"


