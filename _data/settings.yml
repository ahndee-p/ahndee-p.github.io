# Hero Settings
hero:
  enable: true
  # hero__title is the homepage <h1>. Keeping the name in it is deliberate — with three
  # other Andrew Perezes out there, the one H1 on the most-linked page should say who this is.
  hero__title: Hi everyone, I’m Andrew Perez.
  # Andrew's differentiator, verbatim. It's the strongest opening line he has: it names the
  # thing everyone else is doing and then says what he does instead.
  hero__description: Most people positioning around “AI SEO” are talking about using AI to make content or get found on llms. I'm talking about using agents to build and operate the machinery behind organic visibility.
  hero__image: "/images/ap-lecture.png"


