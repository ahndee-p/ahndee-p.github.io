# Site Settings
# THE TAGLINE. "Agentic systems for Search & AI visibility" goes in the title / most
# prominent slot on EVERY platform. Casing is exactly as Andrew published it on LinkedIn
# 2026-09-11 — "Search" and "AI" capitalised. This is the final form: the all-lowercase
# variant is retired, because lowercase "ai" reads as a typo to anyone who doesn't already
# know it's a style choice.
# The name leads here because "Andrew Perez" is the query people type, and a title tag is
# the one place the tagline can't stand alone. 57 characters, so it won't truncate.
