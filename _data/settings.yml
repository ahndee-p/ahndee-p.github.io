#-------------------------------
# Entity Settings  →  feeds _includes/schema.html (JSON-LD)
#
# WHY THIS EXISTS: "Andrew Perez" is a contested name — there are at least three
# others, one also in marketing/SEO. AI engines and search engines have no way to
# tell them apart unless this site says so explicitly. `sameAs` is that statement:
# it asserts that this Andrew Perez is those profiles. Everything below is the
# single source of truth for identity, so the descriptor can never drift between
# the title, the meta description, and the structured data.
#
# RULE: the role and specialty phrases below must appear IDENTICALLY on LinkedIn,
# GitHub, X, YouTube and every repo README. Entity consolidation dies on synonyms.
# The paste-ready copy for those profiles lives in AhndeeOS at
# projects/personal-brand-geo/context/profile-copy.md — keep the two in sync.
entity:
  name: Andrew Perez
  handle: andr3wperez           # the real disambiguator — consistent across every profile
  # Real titles only — "Leader" isn't one, so it stays in prose and out of `jobTitle`,
  # which engines map to known occupations.
  # Manager, not Lead: it's what Andrew published in his LinkedIn headline 2026-09-11, and
  # this field has to match that exactly. "AI Systems Architect" came out at the same time —
  # he dropped it from his bio opener — so the discipline now lives in `knows_about` as a
  # capability rather than in `jobTitle` as a title. Must stay a list; the template calls
  # `.first` on it for hasOccupation.
  job_title:
    - Technical SEO Manager
  # Schema `description` ← Andrew's positioning statement, verbatim, the two paragraphs
  # joined. States the coined term AND the matchable vocabulary in one place.
  bio: I’m a Technical SEO leader building agentic AI systems that automate the
    infrastructure behind search and AI visibility. I combine 15 years of technical SEO
    experience with agentic systems architecture to automate technical SEO, search
    intelligence, content operations, and AI visibility programs at scale.
  # Tells the AI engines WHICH Andrew Perez this is — with facts unique to him rather
  # than by naming anyone else. Deliberately not one of Andrew's copy blocks: its job is
  # separating him from the other three Andrew Perezes, not positioning him.
  # No DietMenus here — Andrew doesn't want ownership of it asserted in his schema
  # (2026-09-11). The disambiguating work is carried by occupation + city + the handle,
  # which is weaker than naming an owned property but still specific.
  disambiguation: Technical SEO manager in Portland, Oregon. Goes by the handle andr3wperez
    across every platform.
  image: '/images/andrew.jpeg'
  locality: Portland
  region: OR
  country: US
  alumni_of: MIT Professional Education
  alumni_url: https://professional.mit.edu/
  # MIT Professional Education has no Wikidata item (checked 2026-09-16). MIT does, so the
  # link to a known entity goes on the parent. Never put Q49108 on alumni_of itself.
  alumni_parent: Massachusetts Institute of Technology
  alumni_parent_same_as: https://www.wikidata.org/wiki/Q49108
  alumni_program: No-Code AI and Machine Learning
  # Both the spelled-out phrase and the acronym, in one entry each — people and
  # recruiters search both forms, and separate acronym-only entries read as padding.
  knows_about:
    - Agentic Technical SEO      # the coined term, stated first
    - Technical SEO
    - Generative engine optimization (GEO)
    - Answer engine optimization (AEO)
    - LLM visibility
    - Programmatic SEO
    - Schema.org structured data
    - Entity SEO
    - Crawl architecture
    - CMS migrations
    - International SEO
    - Enterprise SEO
    - Search intelligence
    - Content operations
    - AI systems architecture   # a capability, not a title — see the job_title note above
    - AI agents
    - Python
    - BigQuery
  # Every owned profile. More verified nodes = better disambiguation.
  # Keep in sync with `social:` below; this list may be longer (entity-only links).
  same_as:
    - https://www.linkedin.com/in/andr3wperez
    - https://x.com/andr3wperez
    - https://github.com/andr3wperez
    # The personal channel ("Andrew Perez"), not @venturemedley. Venture Medley is a
    # separate brand entity, so it isn't a `sameAs` for the person. Both verified live
    # 2026-09-11. ⬜ github URL changes to /andr3wperez after the account rename.
    - https://www.youtube.com/@andr3wperez

social:
- {icon: "ion-logo-linkedin", link: "https://www.linkedin.com/in/andr3wperez"}
- {icon: "ion-logo-twitter", link: "https://x.com/andr3wperez"}
- {icon: "ion-logo-github", link: "https://github.com/andr3wperez"}
- {icon: "ion-logo-youtube", link: "https://www.youtube.com/@venturemedley"}

# Example of adding a new link to the footer - {icon: "ion-logo-dribbble", link: "https://dribbble.com"}
# Other icons can be found at https://ionicons.com/v4/


