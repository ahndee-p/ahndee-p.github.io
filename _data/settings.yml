# prominent slot on EVERY platform, lowercase, as a deliberate brand style. Andrew's call
# 2026-09-11, and it supersedes the earlier rule that reserved lowercase for the hero.
# The name stays in front of it here because "Andrew Perez" is the Ring 1 query — a title
# tag is the one place the tagline can't stand alone.
# 57 characters, so it displays without truncation.
